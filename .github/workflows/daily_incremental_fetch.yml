name: Daily Incremental Data Fetch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch_latest_data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Batch ID
        run: echo "BATCH_ID=$(date -u +%Y-%m-%d_%H%M%S)" >> $GITHUB_ENV

      - name: Fetch Daily NVD Delta (24-hour window)
        run: python fetch_samples.py nvd --load incremental --batch-id ${{ env.BATCH_ID }}

      - name: Fetch Full EPSS Daily Snapshot
        run: python fetch_samples.py epss --load incremental --batch-id ${{ env.BATCH_ID }}

      - name: Fetch Daily KEV Delta (new entries in last 24h)
        run: python fetch_samples.py kev --load incremental --batch-id ${{ env.BATCH_ID }}

      - name: Commit and Push Updated Files to Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sample_raw/incremental/
          git commit -m "chore(data): daily incremental fetch ${{ env.BATCH_ID }}" || echo "No changes to commit"
          git push
